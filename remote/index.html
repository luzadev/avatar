<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#02070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LuZa">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>LuZa</title>
<style>
  :root { --bg:#02070c; --pri:#00d4ff; --pri2:#00ffe1; --dim:#4f7f95; --txt:#d6ecff; --acc:#ffcc00; --spk:#ff6b00; --grn:#00ff88; --red:#ff3366; --glass:rgba(4,20,32,.72); --line:rgba(0,212,255,.22); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:Menlo,ui-monospace,SFMono-Regular,monospace; overflow:hidden; }
  body { display:flex; flex-direction:column; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); position:relative; }
  /* sfondo: griglia di punti + scanline + vignetta */
  body::before { content:""; position:fixed; inset:0; background-image:radial-gradient(rgba(0,212,255,.16) 1px, transparent 1.2px); background-size:22px 22px; pointer-events:none; }
  body::after { content:""; position:fixed; inset:0; background:repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 4px), radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%); pointer-events:none; }
  .corner { position:fixed; width:26px; height:26px; border:1px solid var(--line); pointer-events:none; }
  .corner.tl { top:calc(env(safe-area-inset-top) + 8px); left:8px; border-right:0; border-bottom:0; } .corner.tr { top:calc(env(safe-area-inset-top) + 8px); right:8px; border-left:0; border-bottom:0; }
  .corner.bl { bottom:calc(env(safe-area-inset-bottom) + 8px); left:8px; border-right:0; border-top:0; } .corner.br { bottom:calc(env(safe-area-inset-bottom) + 8px); right:8px; border-left:0; border-top:0; }
  header { padding:12px 18px 4px; display:flex; align-items:center; gap:10px; z-index:1; }
  header .name { font-weight:bold; letter-spacing:5px; color:var(--pri); text-shadow:0 0 12px rgba(0,212,255,.6); font-size:15px; }
  header .sub { font-size:9px; letter-spacing:2px; color:var(--dim); margin-top:2px; }
  header .conn { margin-left:auto; font-size:10px; letter-spacing:1px; color:var(--dim); text-transform:uppercase; }
  header .conn::before { content:"●"; margin-right:5px; }
  #gear { background:transparent; border:1px solid var(--line); color:var(--pri); border-radius:8px; padding:5px 9px; font-size:15px; }
  #core { position:relative; height:190px; z-index:1; }
  #ring { position:absolute; inset:0; width:100%; height:100%; }
  #stateline { position:absolute; left:0; right:0; bottom:8px; text-align:center; font-size:11px; letter-spacing:2px; color:var(--dim); text-transform:uppercase; }
  #stateline b { color:var(--pri); font-weight:normal; }
  #wave { display:block; width:100%; height:34px; z-index:1; }
  #log { flex:1; overflow-y:auto; padding:6px 12px 10px; display:flex; flex-direction:column; gap:7px; z-index:1; -webkit-overflow-scrolling:touch; }
  .m { max-width:88%; padding:9px 12px; border-radius:4px; font-size:14px; line-height:1.4; white-space:pre-wrap; word-break:break-word; position:relative; background:var(--glass); backdrop-filter:blur(6px); border:1px solid var(--line); }
  .m.you { align-self:flex-end; border-color:rgba(0,255,136,.35); border-right:2px solid var(--grn); }
  .m.ava { align-self:flex-start; border-left:2px solid var(--pri); box-shadow:0 0 14px rgba(0,212,255,.08); }
  .m.ava::before { content:"LUZA"; display:block; font-size:9px; letter-spacing:2px; color:var(--pri); opacity:.8; margin-bottom:3px; }
  .m.you::before { content:"TU"; display:block; font-size:9px; letter-spacing:2px; color:var(--grn); opacity:.8; margin-bottom:3px; text-align:right; }
  .m.img { padding:4px; max-width:78%; } .m.img::before { display:none; } .m.img img { display:block; width:100%; border-radius:3px; }
  .viewer { position:fixed; inset:0; background:rgba(0,4,8,.96); display:flex; align-items:center; justify-content:center; z-index:50; }
  .viewer img { max-width:100%; max-height:100%; object-fit:contain; box-shadow:0 0 30px rgba(0,212,255,.25); }
  .m.file a { color:var(--pri); text-decoration:none; font-weight:bold; } .m.file::before { display:none; }
  .m.sys { align-self:center; font-size:10px; letter-spacing:1px; color:var(--dim); background:transparent; border:0; padding:1px 8px; backdrop-filter:none; }
  .m.err { align-self:center; font-size:12px; color:var(--red); border-color:rgba(255,51,102,.4); }
  #confirm { display:none; margin:0 12px 8px; padding:12px; border:1px solid var(--acc); border-radius:4px; background:rgba(40,32,0,.8); box-shadow:0 0 18px rgba(255,204,0,.25); z-index:1; }
  #confirm .t { color:var(--acc); font-weight:bold; letter-spacing:1px; margin-bottom:4px; } #confirm .d { font-size:12px; white-space:pre-wrap; margin-bottom:10px; }
  footer { display:flex; gap:10px; padding:10px 14px 14px; align-items:center; border-top:1px solid var(--line); background:linear-gradient(180deg, rgba(2,7,12,.1), rgba(2,7,12,.96)); z-index:1; }
  .capsule { flex:1; min-width:0; display:flex; align-items:center; background:rgba(0,18,30,.75); border:1px solid var(--line); border-radius:24px; padding:3px 4px 3px 16px; transition:border-color .2s, box-shadow .2s; }
  .capsule:focus-within { border-color:var(--pri); box-shadow:0 0 14px rgba(0,212,255,.22); }
  .capsule input { flex:1; min-width:0; background:transparent; border:0; color:var(--txt); font:inherit; font-size:15px; padding:10px 0; outline:none; caret-color:var(--pri); }
  .icon { width:38px; height:38px; border-radius:50%; border:1px solid transparent; background:transparent; color:var(--pri); display:flex; align-items:center; justify-content:center; padding:0; }
  .icon svg { width:20px; height:20px; fill:currentColor; }
  .icon.send { opacity:.35; transition:opacity .15s, background .15s; } .icon.send.on { opacity:1; background:rgba(0,212,255,.12); }
  .icon.stop { display:none; color:var(--red); border-color:rgba(255,51,102,.5); background:rgba(40,0,14,.7); box-shadow:0 0 12px rgba(255,51,102,.3); width:44px; height:44px; }
  .icon.stop.on { display:flex; }
  .micbtn { position:relative; width:56px; height:56px; border-radius:50%; border:1px solid var(--grn); background:radial-gradient(circle at 50% 40%, rgba(0,255,136,.18), rgba(0,20,30,.9) 70%); color:var(--grn); display:flex; align-items:center; justify-content:center; padding:0; box-shadow:0 0 16px rgba(0,255,136,.25), inset 0 0 12px rgba(0,255,136,.12); }
  .micbtn svg { width:26px; height:26px; fill:currentColor; }
  .micbtn .halo { position:absolute; inset:-6px; border-radius:50%; border:1px solid rgba(0,255,136,.35); animation:halo 2.4s ease-out infinite; pointer-events:none; }
  @keyframes halo { 0% { transform:scale(.9); opacity:.6; } 100% { transform:scale(1.35); opacity:0; } }
  .micbtn.rec { border-color:var(--red); color:var(--red); background:radial-gradient(circle at 50% 40%, rgba(255,51,102,.35), rgba(40,0,14,.95) 70%); box-shadow:0 0 22px rgba(255,51,102,.55); }
  .micbtn.rec .halo { border-color:rgba(255,51,102,.6); animation-duration:1s; }
  button:active { transform:scale(.94); }
  #pair button, #settings button, #confirm button { background:rgba(0,20,32,.7); border:1px solid var(--line); color:var(--txt); border-radius:4px; font:inherit; font-size:13px; padding:10px 14px; letter-spacing:1px; }
  #pair button.pri, #settings button.pri, #confirm button.pri { border-color:var(--pri); color:var(--pri); box-shadow:0 0 10px rgba(0,212,255,.2); }
  @keyframes blink { 50% { opacity:.55; } }
  #pair { display:none; flex-direction:column; gap:12px; padding:26px 22px; text-align:center; z-index:1; }
  #pair .box { border:1px solid var(--line); background:var(--glass); padding:18px; border-radius:4px; }
  #pair input { width:100%; font-size:26px; text-align:center; letter-spacing:8px; }
  #settings { display:none; margin:0 12px 8px; padding:12px; border:1px solid var(--line); border-radius:4px; background:var(--glass); backdrop-filter:blur(8px); font-size:13px; z-index:1; max-height:55vh; overflow-y:auto; }
  #settings .h { color:var(--pri); letter-spacing:3px; font-size:11px; margin-bottom:8px; }
  #sform label { display:block; margin:8px 0 3px; color:var(--dim); font-size:10px; letter-spacing:1px; text-transform:uppercase; }
  #sform select { width:100%; background:rgba(0,10,18,.9); color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:9px; font:inherit; font-size:14px; }
  .boot { animation:boot .8s ease-out; } @keyframes boot { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
</style>
</head>
<body>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<header class="boot"><div><div class="name">LUZA</div><div class="sub">ASSISTENTE PERSONALE · REMOTO</div></div><span id="conn" class="conn">…</span><button id="gear" onclick="openSettings()">⚙</button></header>
<div id="pair">
  <div class="box"><div style="color:var(--pri);letter-spacing:3px;font-size:11px;margin-bottom:10px">ABBINAMENTO</div>
  <div style="font-size:13px;color:var(--dim);margin-bottom:12px">Sul Mac premi <b style="color:var(--txt)">Remote Control</b> e digita il PIN di 6 cifre, oppure inquadra il QR.</div>
  <input id="key" type="text" inputmode="numeric" placeholder="······" autocapitalize="off" autocorrect="off">
  <div style="height:10px"></div><button class="pri" onclick="savePair()">COLLEGA</button></div>
</div>
<div id="core" class="boot"><canvas id="ring"></canvas><div id="stateline"><b id="stbase">LISTENING</b><span id="stdetail"></span></div></div>
<canvas id="wave" class="boot"></canvas>
<div id="settings"><div class="h">MOTORE E VOCE</div><div id="sform"></div>
  <div style="margin-top:12px; display:flex; gap:8px"><button class="pri" onclick="saveSettings()">SALVA E APPLICA</button><button onclick="$('settings').style.display='none'">CHIUDI</button></div>
  <div id="shint" style="margin-top:6px; color:var(--dim); font-size:11px"></div></div>
<div id="log"></div>
<div id="confirm"><div class="t" id="ct"></div><div class="d" id="cd"></div><button class="pri" onclick="doConfirm(true)">CONFERMA</button> <button onclick="doConfirm(false)">ANNULLA</button></div>
<footer>
  <div class="capsule">
    <input id="txt" type="text" placeholder="Scrivi a LuZa…" enterkeyhint="send" oninput="onTyping()" onkeydown="if(event.key==='Enter')sendText()">
    <button id="sendb" class="icon send" onclick="sendText()" aria-label="Invia"><svg viewBox="0 0 24 24"><path d="M3 11.5 21 3l-7.5 18-2.3-7.2L3 11.5z"/></svg></button>
  </div>
  <button id="stopb" class="icon stop" onclick="send({type:'interrupt'})" aria-label="Interrompi"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
  <button id="mic" class="micbtn" onclick="toggleMic()" aria-label="Parla"><span class="halo"></span><svg viewBox="0 0 24 24"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
</footer>
<script src="/static/app.js"></script>
</body>
</html>
